<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3faf">
<title>Offline · Suvakta</title>
<style>
  :root { color-scheme: light dark; --bg:#fbfcfd; --fg:#1d2026; --muted:#5f6573; --brand:#1b3faf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#eef0f3; --muted:#a3a8b3; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:24px; box-sizing:border-box; text-align:center; }
  img { width:72px; height:72px; }
  h1 { font-size:22px; margin:16px 0 4px; }
  p { color:var(--muted); margin:0 0 20px; max-width:320px; }
  button { min-height:48px; padding:0 24px; border:0; border-radius:14px; background:var(--brand); color:#fff; font-weight:600; font-size:15px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Suvakta">
    <h1>You're offline</h1>
    <p>This page hasn't been opened on this phone before. Pages you've visited — like New sale, Khata and Inventory — still work offline, and changes sync when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
