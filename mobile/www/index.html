<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suvakta</title>
<style>
  :root { color-scheme: dark; }
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#0b1a18;color:#f3efe6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  .mark{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#2bb897,#0a7fa6);
    display:grid;place-items:center;margin:0 auto 20px;font-weight:800;font-size:34px;color:#042a2a}
  h1{margin:0 0 6px;font-size:22px}
  p{margin:0;color:#b9c9c2;max-width:300px;line-height:1.5}
  button{margin-top:22px;padding:12px 22px;border:0;border-radius:999px;font-weight:700;font-size:16px;
    background:linear-gradient(135deg,#2bb897,#0a7fa6);color:#042a2a}
</style>
</head>
<body>
  <div>
    <div class="mark">सु</div>
    <h1>Suvakta</h1>
    <p>You're offline. Connect to the internet to run your shop by voice.</p>
    <button onclick="location.href='https://suvakta.com'">Retry</button>
  </div>
</body>
</html>
